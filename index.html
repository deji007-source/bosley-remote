<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bosley Remote</title>
<link href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%9B%EF%B8%8F%3C/text%3E%3C/svg%3E" rel="icon" />
<style>
  :root {
    --bg: #0b0f14; --surface: #121821; --border: #232c38;
    --text: #e8edf4; --muted: #8894a3; --accent: #2fb8e6; --ok: #35c97a; --rec: #e85d3d;
    color-scheme: dark light;
    box-sizing: border-box; padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f4f6f9; --surface:#fff; --border:#dde3ea; --text:#141a22; --muted:#5b6673;
    }
  }
  * { box-sizing: border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text); font-family:-apple-system,Inter,system-ui,sans-serif;
    padding:1.3rem 1rem 3rem; max-width:560px; margin:0 auto;
  }
  h1 { font-size:1.15rem; margin:0 0 .15rem; display:flex; align-items:center; justify-content:space-between; }
  .sub { color:var(--muted); font-size:.78rem; margin-bottom:1.1rem; }
  .section { margin-bottom:1.3rem; }
  .section h2 { font-size:.76rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 .5rem; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
  .grid.two { grid-template-columns:repeat(2,1fr); }
  button.btn {
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:.65rem .5rem; font-size:.78rem; font-weight:600;
    cursor:pointer; text-align:center; transition:transform .08s; line-height:1.25;
  }
  button.btn:active { transform:scale(.96); background:var(--accent); color:#06222d; }
  button.btn.wake { background:linear-gradient(135deg,#e85d3d,#2fb8e6); color:#fff; border:none; font-size:.95rem; padding:.85rem; }

  .mic-wrap { display:flex; flex-direction:column; align-items:center; gap:.5rem; margin:1rem 0 1.4rem; }
  #micBtn {
    width:74px; height:74px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#1a8fb0); color:#06222d; font-size:1.6rem;
    box-shadow:0 4px 18px rgba(47,184,230,.35); transition:transform .1s, background .2s;
  }
  #micBtn.recording { background:linear-gradient(135deg,var(--rec),#b03d22); animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(232,93,61,.5)} 70%{box-shadow:0 0 0 16px rgba(232,93,61,0)} 100%{box-shadow:0 0 0 0 rgba(232,93,61,0)} }
  #micStatus { font-size:.8rem; color:var(--muted); min-height:1.1em; text-align:center; }
  #micResult { font-size:.82rem; min-height:1.2em; text-align:center; font-weight:600; }
  #micResult.ok { color:var(--ok); }
  #micResult.warn { color:var(--rec); }

  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ok); color:#06220f; padding:.6rem 1.1rem; border-radius:10px;
    font-size:.85rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<h1>🎛️ Bosley Remote</h1>
<div class="sub">Tap to fire instantly, or hold the mic to speak a command.</div>

<div class="section">
  <button class="btn wake" id="wakeBtn" style="width:100%">🎧 Wake Up</button>
</div>

<div class="mic-wrap">
  <button id="micBtn">🎤</button>
  <div id="micStatus">Tap to talk</div>
  <div id="micResult"></div>
</div>

<div class="section">
  <h2>Desktops</h2>
  <div class="grid two" id="desktopGrid"></div>
</div>

<div class="section">
  <h2>Quick actions</h2>
  <div class="grid two" id="quickGrid"></div>
</div>

<div class="section">
  <h2>Apps</h2>
  <div class="grid" id="appsGrid"><div class="sub">Loading your apps…</div></div>
</div>

<div class="toast" id="toast">Sent</div>

<script>
  const ACTION_URL = "https://ywwfqisbmlkjcfoqehph.supabase.co/functions/v1/remote-action";
  const SHORTCUTS_URL = "https://ywwfqisbmlkjcfoqehph.supabase.co/functions/v1/get-shortcuts";
  const VOICE_URL = "https://ywwfqisbmlkjcfoqehph.supabase.co/functions/v1/remote-voice";

  const toast = document.getElementById("toast");
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1400);
  }

  async function sendAutomation(instruction) {
    showToast(`Sent: ${instruction}`);
    try {
      await fetch(ACTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "automation", instruction }),
      });
    } catch (e) {}
  }

  async function sendOs(action, param) {
    showToast(`Sent: ${action} ${param ?? ""}`);
    try {
      await fetch(ACTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "os", action, param: String(param) }),
      });
    } catch (e) {}
  }

  document.getElementById("wakeBtn").onclick = () => sendAutomation("wake up");

  const desktopGrid = document.getElementById("desktopGrid");
  [1, 2, 3].forEach((n) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = `🖥️ Desktop ${n}`;
    b.onclick = () => sendOs("switch_desktop", n);
    desktopGrid.appendChild(b);
  });

  const quickGrid = document.getElementById("quickGrid");
  [
    ["📞 Call Dotun", "call dotun"],
    ["🔊 Bluetooth on", "turn on bluetooth"],
  ].forEach(([label, instruction]) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = label;
    b.onclick = () => sendAutomation(instruction);
    quickGrid.appendChild(b);
  });

  const appsGrid = document.getElementById("appsGrid");
  fetch(SHORTCUTS_URL)
    .then((r) => r.json())
    .then((d) => {
      appsGrid.innerHTML = "";
      (d.shortcuts || []).forEach((s) => {
        const b = document.createElement("button");
        b.className = "btn";
        b.textContent = `🚀 ${s.title}`;
        b.onclick = () => sendAutomation(`open ${s.title}`);
        appsGrid.appendChild(b);
      });
    })
    .catch(() => { appsGrid.innerHTML = '<div class="sub">Couldn\'t load apps.</div>'; });

  // ---------- Tap-to-talk voice ----------
  const micBtn = document.getElementById("micBtn");
  const micStatus = document.getElementById("micStatus");
  const micResult = document.getElementById("micResult");
  let mediaRecorder = null, chunks = [], startTime = 0, recording = false;

  micBtn.onclick = async () => {
    if (!recording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = sendVoice;
        mediaRecorder.start();
        startTime = Date.now();
        recording = true;
        micBtn.classList.add("recording");
        micStatus.textContent = "Listening… tap to stop";
        micResult.textContent = "";
      } catch (e) {
        micStatus.textContent = "Mic permission denied";
      }
    } else {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach((t) => t.stop());
      recording = false;
      micBtn.classList.remove("recording");
      micStatus.textContent = "Processing…";
    }
  };

  async function sendVoice() {
    const duration = (Date.now() - startTime) / 1000;
    const blob = new Blob(chunks, { type: "audio/webm" });
    const form = new FormData();
    form.append("audio", blob);
    form.append("duration", String(duration));
    micResult.className = "";
    micResult.textContent = "";
    try {
      const res = await fetch(VOICE_URL, { method: "POST", body: form });
      const data = await res.json();
      if (data.error) {
        micResult.className = "warn";
        micResult.textContent = data.error;
      } else if (data.recognized) {
        micResult.className = "ok";
        micResult.textContent = `Running: ${data.ran}`;
      } else {
        micResult.className = "warn";
        micResult.textContent = `Didn't recognize: "${data.transcript}"`;
      }
    } catch (e) {
      micResult.className = "warn";
      micResult.textContent = "Couldn't reach the server.";
    }
    micStatus.textContent = "Tap to talk";
  }
</script>
</body>
</html>
