<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bosley Remote</title>
<link href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%9B%EF%B8%8F%3C/text%3E%3C/svg%3E" rel="icon" />
<style>
  :root {
    --bg: #0b0f14; --surface: #121821; --border: #232c38;
    --text: #e8edf4; --muted: #8894a3; --accent: #2fb8e6; --ok: #35c97a;
    color-scheme: dark light;
    box-sizing: border-box; padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f4f6f9; --surface:#fff; --border:#dde3ea; --text:#141a22; --muted:#5b6673;
    }
  }
  * { box-sizing: border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text); font-family:-apple-system,Inter,system-ui,sans-serif;
    padding:1.5rem 1rem 3rem; max-width:520px; margin:0 auto;
  }
  h1 { font-size:1.2rem; margin:0 0 .2rem; }
  .sub { color:var(--muted); font-size:.82rem; margin-bottom:1.3rem; }
  .section { margin-bottom:1.6rem; }
  .section h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 .6rem; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; }
  .grid.wide { grid-template-columns:1fr; }
  button.btn {
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:.9rem .8rem; font-size:.95rem; font-weight:600;
    cursor:pointer; text-align:left; transition:transform .08s;
  }
  button.btn:active { transform:scale(.97); background:var(--accent); color:#06222d; }
  button.btn.wake { background:linear-gradient(135deg,#e85d3d,#2fb8e6); color:#fff; border:none; font-size:1.05rem; }
  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ok); color:#06220f; padding:.6rem 1.1rem; border-radius:10px;
    font-size:.85rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<h1>🎛️ Bosley Remote</h1>
<div class="sub">Tap to fire instantly. Needs the laptop listener (and agent, for desktops) running.</div>

<div class="section">
  <button class="btn wake" id="wakeBtn" style="width:100%">🎧 Wake Up</button>
</div>

<div class="section">
  <h2>Desktops</h2>
  <div class="grid" id="desktopGrid"></div>
</div>

<div class="section">
  <h2>Quick actions</h2>
  <div class="grid" id="quickGrid"></div>
</div>

<div class="section">
  <h2>Apps</h2>
  <div class="grid wide" id="appsGrid"><div class="sub">Loading your apps…</div></div>
</div>

<div class="toast" id="toast">Sent</div>

<script>
  const ACTION_URL = "https://ywwfqisbmlkjcfoqehph.supabase.co/functions/v1/remote-action";
  const SHORTCUTS_URL = "https://ywwfqisbmlkjcfoqehph.supabase.co/functions/v1/get-shortcuts";

  const toast = document.getElementById("toast");
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1400);
  }

  async function sendAutomation(instruction) {
    showToast(`Sent: ${instruction}`);
    try {
      await fetch(ACTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "automation", instruction }),
      });
    } catch (e) {}
  }

  async function sendOs(action, param) {
    showToast(`Sent: ${action} ${param ?? ""}`);
    try {
      await fetch(ACTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "os", action, param: String(param) }),
      });
    } catch (e) {}
  }

  document.getElementById("wakeBtn").onclick = () => sendAutomation("wake up");

  const desktopGrid = document.getElementById("desktopGrid");
  [1, 2, 3].forEach((n) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = `🖥️ Desktop ${n}`;
    b.onclick = () => sendOs("switch_desktop", n);
    desktopGrid.appendChild(b);
  });

  const quickGrid = document.getElementById("quickGrid");
  [
    ["📞 Call Dotun", "call dotun"],
    ["🔊 Bluetooth on", "turn on bluetooth"],
  ].forEach(([label, instruction]) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = label;
    b.onclick = () => sendAutomation(instruction);
    quickGrid.appendChild(b);
  });

  const appsGrid = document.getElementById("appsGrid");
  fetch(SHORTCUTS_URL)
    .then((r) => r.json())
    .then((d) => {
      appsGrid.innerHTML = "";
      (d.shortcuts || []).forEach((s) => {
        const b = document.createElement("button");
        b.className = "btn";
        b.textContent = `🚀 ${s.title}`;
        b.onclick = () => sendAutomation(`open ${s.title}`);
        appsGrid.appendChild(b);
      });
    })
    .catch(() => { appsGrid.innerHTML = '<div class="sub">Couldn\'t load apps.</div>'; });
</script>
</body>
</html>
